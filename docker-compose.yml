# ──────────────────────────────────────────────
# Docker Compose — Commerce Master Dev Environment
# Phase 0: Local development only.
# No production secrets. No SSL termination (use reverse proxy in prod).
# ──────────────────────────────────────────────
services:

  # ── WordPress (PHP-FPM + Apache) ──
  wordpress:
    image: wordpress:7.0.2-php8.3-apache
    container_name: commerce_master_wp
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${DB_NAME:-wordpress}
      WORDPRESS_DB_USER: ${DB_USER:-wp_user}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:-change_me}
      WORDPRESS_TABLE_PREFIX: ${DB_TABLE_PREFIX:-wp_}
      WORDPRESS_DEBUG: ${WP_DEBUG:-true}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_HOME', '${WP_HOME:-http://localhost:8080}');
        define('WP_SITEURL', '${WP_SITEURL:-http://localhost:8080}');
        define('WP_DEBUG_LOG', ${WP_DEBUG_LOG:-true});
        define('WP_DEBUG_DISPLAY', ${WP_DEBUG_DISPLAY:-false});
        define('AUTH_KEY', '${AUTH_KEY:-generate_me}');
        define('SECURE_AUTH_KEY', '${SECURE_AUTH_KEY:-generate_me}');
        define('LOGGED_IN_KEY', '${LOGGED_IN_KEY:-generate_me}');
        define('NONCE_KEY', '${NONCE_KEY:-generate_me}');
        define('AUTH_SALT', '${AUTH_SALT:-generate_me}');
        define('SECURE_AUTH_SALT', '${SECURE_AUTH_SALT:-generate_me}');
        define('LOGGED_IN_SALT', '${LOGGED_IN_SALT:-generate_me}');
        define('NONCE_SALT', '${NONCE_SALT:-generate_me}');
      # Pass-through env vars for init script (read by WP-CLI container)
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change_me_to_a_strong_password}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      BRAND_NAME: ${BRAND_NAME:-Commerce Master}
      BRAND_TAGLINE: ${BRAND_TAGLINE:-Fashion for the modern world}
      DEFAULT_LOCALE: ${DEFAULT_LOCALE:-en_US}
      BASE_CURRENCY: ${BASE_CURRENCY:-USD}
      ENABLED_CURRENCIES: ${ENABLED_CURRENCIES:-USD,EUR,GBP}
      DEFAULT_MARKET: ${DEFAULT_MARKET:-EU}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-support@example.com}
      SUPPORT_PHONE: ${SUPPORT_PHONE:-}
      # Payment gateway env vars (read by PaymentConfig via getenv())
      STRIPE_TEST_PUBLISHABLE_KEY: ${STRIPE_TEST_PUBLISHABLE_KEY:-}
      STRIPE_TEST_SECRET_KEY: ${STRIPE_TEST_SECRET_KEY:-}
      STRIPE_LIVE_PUBLISHABLE_KEY: ${STRIPE_LIVE_PUBLISHABLE_KEY:-}
      STRIPE_LIVE_SECRET_KEY: ${STRIPE_LIVE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      PAYPAL_SANDBOX_CLIENT_ID: ${PAYPAL_SANDBOX_CLIENT_ID:-}
      PAYPAL_SANDBOX_CLIENT_SECRET: ${PAYPAL_SANDBOX_CLIENT_SECRET:-}
      PAYPAL_LIVE_CLIENT_ID: ${PAYPAL_LIVE_CLIENT_ID:-}
      PAYPAL_LIVE_CLIENT_SECRET: ${PAYPAL_LIVE_CLIENT_SECRET:-}
      PAYPAL_WEBHOOK_ID: ${PAYPAL_WEBHOOK_ID:-}
    volumes:
      - wordpress_data:/var/www/html
      - ./wp-content/plugins/commerce-core:/var/www/html/wp-content/plugins/commerce-core:ro
      - ./wp-content/themes/commerce-block-theme:/var/www/html/wp-content/themes/commerce-block-theme:ro
    ports:
      - "${HTTP_PORT:-8080}:80"
    networks:
      - commerce_net

  # ── MariaDB Database ──
  db:
    image: mariadb:11.8
    container_name: commerce_master_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-wordpress}
      MYSQL_USER: ${DB_USER:-wp_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change_me}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-change_me_root}
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3307:3306"
    networks:
      - commerce_net
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── phpMyAdmin (dev convenience) ──
  phpmyadmin:
    image: phpmyadmin:5.2-apache
    container_name: commerce_master_pma
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    ports:
      - "${PMA_PORT:-8090}:80"
    networks:
      - commerce_net

  # ── WP-CLI (for initialization scripts) ──
  wpcli:
    image: wordpress:cli-2.12.0-php8.3
    container_name: commerce_master_cli
    depends_on:
      db:
        condition: service_healthy
      wordpress:
        condition: service_started
    user: "33:33"  # www-data
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${DB_NAME:-wordpress}
      WORDPRESS_DB_USER: ${DB_USER:-wp_user}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:-change_me}
      DB_PASSWORD: ${DB_PASSWORD:-change_me}
      # Admin credentials for init script
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change_me_to_a_strong_password}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      # Brand / site configuration
      BRAND_NAME: ${BRAND_NAME:-Commerce Master}
      BRAND_TAGLINE: ${BRAND_TAGLINE:-Fashion for the modern world}
      DEFAULT_LOCALE: ${DEFAULT_LOCALE:-en_US}
      BASE_CURRENCY: ${BASE_CURRENCY:-USD}
      ENABLED_CURRENCIES: ${ENABLED_CURRENCIES:-USD,EUR,GBP}
      DEFAULT_MARKET: ${DEFAULT_MARKET:-EU}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-support@example.com}
      SUPPORT_PHONE: ${SUPPORT_PHONE:-}
      WP_HOME: ${WP_HOME:-http://localhost:8080}
      # Payment gateway env vars (read by PaymentConfig via getenv())
      STRIPE_TEST_PUBLISHABLE_KEY: ${STRIPE_TEST_PUBLISHABLE_KEY:-}
      STRIPE_TEST_SECRET_KEY: ${STRIPE_TEST_SECRET_KEY:-}
      STRIPE_LIVE_PUBLISHABLE_KEY: ${STRIPE_LIVE_PUBLISHABLE_KEY:-}
      STRIPE_LIVE_SECRET_KEY: ${STRIPE_LIVE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      PAYPAL_SANDBOX_CLIENT_ID: ${PAYPAL_SANDBOX_CLIENT_ID:-}
      PAYPAL_SANDBOX_CLIENT_SECRET: ${PAYPAL_SANDBOX_CLIENT_SECRET:-}
      PAYPAL_LIVE_CLIENT_ID: ${PAYPAL_LIVE_CLIENT_ID:-}
      PAYPAL_LIVE_CLIENT_SECRET: ${PAYPAL_LIVE_CLIENT_SECRET:-}
      PAYPAL_WEBHOOK_ID: ${PAYPAL_WEBHOOK_ID:-}
      # WordPress salts (must be passed for WP-CLI to generate correct config)
      AUTH_KEY: ${AUTH_KEY:-generate_me}
      SECURE_AUTH_KEY: ${SECURE_AUTH_KEY:-generate_me}
      LOGGED_IN_KEY: ${LOGGED_IN_KEY:-generate_me}
      NONCE_KEY: ${NONCE_KEY:-generate_me}
      AUTH_SALT: ${AUTH_SALT:-generate_me}
      SECURE_AUTH_SALT: ${SECURE_AUTH_SALT:-generate_me}
      LOGGED_IN_SALT: ${LOGGED_IN_SALT:-generate_me}
      NONCE_SALT: ${NONCE_SALT:-generate_me}
    volumes:
      - wordpress_data:/var/www/html
      - ./wp-content/plugins/commerce-core:/var/www/html/wp-content/plugins/commerce-core:ro
      - ./wp-content/themes/commerce-block-theme:/var/www/html/wp-content/themes/commerce-block-theme:ro
      - ./scripts:/scripts:ro
    networks:
      - commerce_net
    profiles:
      - cli  # Only runs with: docker compose --profile cli run --rm wpcli ...

  # ── Node (for theme build/lint) ──
  node:
    image: node:22-alpine
    container_name: commerce_master_node
    working_dir: /app
    volumes:
      - ./wp-content/themes/commerce-block-theme:/app
      - node_modules_data:/app/node_modules
    networks:
      - commerce_net
    profiles:
      - build  # Only runs with: docker compose --profile build run --rm node ...
    command: ["echo", "Node container ready. Use: docker compose --profile build run --rm node npm ci"]

volumes:
  wordpress_data:
  db_data:
  node_modules_data:

networks:
  commerce_net:
    driver: bridge
