name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  php-checks:
    name: PHP Lint / PHPCS / PHPStan / PHPUnit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wp-content/plugins/commerce-core
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: dom, iconv, mbstring, mysql, zip
          coverage: xdebug
          tools: composer

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: PHP Lint
        run: composer lint

      - name: PHPCS (WordPress Coding Standards)
        run: composer phpcs

      - name: PHPStan (Static Analysis)
        run: composer phpstan

      - name: PHPUnit
        run: composer test

  theme-checks:
    name: Theme Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wp-content/themes/commerce-block-theme
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci || npm install

      - name: Lint JS
        run: npm run lint:js

      - name: Lint CSS
        run: npm run lint:css

  docker-check:
    name: Docker Compose Config Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: docker compose config -q
