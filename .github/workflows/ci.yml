name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  php-checks:
    name: PHP Lint / PHPCS / PHPStan / PHPUnit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wp-content/plugins/commerce-core
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: dom, iconv, mbstring, mysql, zip
          coverage: xdebug
          tools: composer

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies (uses committed composer.lock)
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Upload composer.lock
        uses: actions/upload-artifact@v4
        with:
          name: composer-lock
          path: wp-content/plugins/commerce-core/composer.lock
          if-no-files-found: error

      - name: PHP Lint
        run: composer lint

      - name: PHPCS (WordPress Coding Standards)
        run: composer phpcs

      - name: PHPStan (Static Analysis)
        run: composer phpstan

      - name: PHPUnit
        run: composer test

  theme-checks:
    name: Theme Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wp-content/themes/commerce-block-theme
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Lint JS
        run: npm run lint:js

      - name: Lint CSS
        run: npm run lint:css

  static-block-scan:
    name: Static Block Name Scanner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run block-name-scanner.sh
        run: bash scripts/block-name-scanner.sh

      - name: Validate docker-compose.yml
        run: docker compose config -q

  docker-integration:
    name: Docker Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Generate test .env with random salts
        run: |
          cat > .env << 'ENVEOF'
          DB_NAME=wordpress
          DB_USER=wp_user
          DB_PASSWORD=test_db_password_12345
          DB_ROOT_PASSWORD=test_root_password_12345
          DB_HOST=db:3306
          DB_TABLE_PREFIX=wp_

          ADMIN_USER=admin
          ADMIN_PASSWORD=TestPassword12345!
          ADMIN_EMAIL=admin@example.com

          WP_HOME=http://localhost:8080
          WP_SITEURL=http://localhost:8080
          WP_DEBUG=true
          WP_DEBUG_LOG=true
          WP_DEBUG_DISPLAY=false

          AUTH_KEY=$(openssl rand -hex 32)
          SECURE_AUTH_KEY=$(openssl rand -hex 32)
          LOGGED_IN_KEY=$(openssl rand -hex 32)
          NONCE_KEY=$(openssl rand -hex 32)
          AUTH_SALT=$(openssl rand -hex 32)
          SECURE_AUTH_SALT=$(openssl rand -hex 32)
          LOGGED_IN_SALT=$(openssl rand -hex 32)
          NONCE_SALT=$(openssl rand -hex 32)

          BRAND_NAME=Commerce Master
          BRAND_TAGLINE=Fashion for the modern world
          DEFAULT_LOCALE=en_US
          BASE_CURRENCY=USD
          ENABLED_CURRENCIES=USD,EUR,GBP
          DEFAULT_MARKET=EU

          SUPPORT_EMAIL=support@example.com
          SUPPORT_PHONE=

          HTTP_PORT=8080
          PMA_PORT=8090
          ENVEOF
          # Generate real random salts
          for key in AUTH_KEY SECURE_AUTH_KEY LOGGED_IN_KEY NONCE_KEY AUTH_SALT SECURE_AUTH_SALT LOGGED_IN_SALT NONCE_SALT; do
            val=$(openssl rand -hex 32)
            sed -i "s|^${key}=.*|${key}=${val}|" .env
          done
          echo "✅ .env generated with random salts"

      - name: Start Docker Compose
        run: docker compose up -d

      - name: Wait for database
        run: |
          echo "Waiting for MariaDB..."
          for i in $(seq 1 30); do
            if docker compose exec -T db mariadb-admin ping -h localhost -u root -ptest_root_password_12345 --silent 2>/dev/null; then
              echo "✅ Database is ready"
              exit 0
            fi
            echo "  Attempt $i/30..."
            sleep 5
          done
          echo "❌ Database did not become ready"
          docker compose logs db
          exit 1

      - name: Wait for WordPress
        run: |
          echo "Waiting for WordPress..."
          for i in $(seq 1 60); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/wp-admin/install.php 2>/dev/null || echo "000")
            if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "302" ]; then
              echo "✅ WordPress is ready (HTTP $HTTP_CODE)"
              exit 0
            fi
            echo "  Attempt $i/60 (HTTP $HTTP_CODE)..."
            sleep 5
          done
          echo "❌ WordPress did not become ready"
          docker compose logs wordpress
          exit 1

      - name: Run init.sh (first run)
        run: |
          docker compose --profile cli run --rm wpcli bash /scripts/init.sh 2>&1 | tee /tmp/init-run1.log
          EXIT_CODE=${PIPESTATUS[0]}
          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "❌ init.sh (first run) failed with exit code $EXIT_CODE"
            exit 1
          fi
          echo "✅ First init.sh completed"

      - name: Run init.sh (second run — idempotency check)
        run: |
          docker compose --profile cli run --rm wpcli bash /scripts/init.sh 2>&1 | tee /tmp/init-run2.log
          EXIT_CODE=${PIPESTATUS[0]}
          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "❌ init.sh (second run) failed with exit code $EXIT_CODE"
            exit 1
          fi
          echo "✅ Second init.sh completed (idempotency verified)"

      - name: Run smoke checks
        run: |
          docker compose --profile cli run --rm wpcli bash /scripts/smoke-check.sh 2>&1 | tee /tmp/smoke-check.log
          EXIT_CODE=${PIPESTATUS[0]}
          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "❌ Smoke checks failed with exit code $EXIT_CODE"
            exit 1
          fi

      - name: Run block runtime check
        run: |
          docker compose --profile cli run --rm wpcli wp eval-file /scripts/block-runtime-check.php 2>&1 | tee /tmp/block-runtime.log
          EXIT_CODE=${PIPESTATUS[0]}
          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "❌ Block runtime check failed with exit code $EXIT_CODE"
            exit 1
          fi

      - name: Verify page HTTP status codes
        run: |
          echo "── HTTP Status Checks ──"
          for path in "/" "/shop/" "/cart/" "/checkout/" "/my-account/"; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:8080${path}" 2>/dev/null || echo "000")
            if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "302" ]; then
              echo "  ✅ ${path} → ${HTTP_CODE}"
            else
              echo "  ❌ ${path} → ${HTTP_CODE}"
              exit 1
            fi
          done

      - name: Verify product detail page
        run: |
          # Use WooCommerce's native function to find product by SKU (more reliable than raw meta query).
          PRODUCT_ID=$(docker compose --profile cli run --rm wpcli wp eval "echo wc_get_product_id_by_sku('WOM-TS-001');" 2>/dev/null)
          if [ -z "$PRODUCT_ID" ] || [ "$PRODUCT_ID" = "0" ]; then
            echo "  ❌ Product with SKU WOM-TS-001 not found"
            # Debug: list all products with their SKUs
            echo "  ── Debug: All products ──"
            docker compose --profile cli run --rm wpcli wp post list --post_type=product --post_status=publish --fields=ID,post_title --format=table 2>/dev/null
            exit 1
          fi
          PRODUCT_URL=$(docker compose --profile cli run --rm wpcli wp eval "echo get_permalink($PRODUCT_ID);" 2>/dev/null)
          if [ -z "$PRODUCT_URL" ]; then
            echo "  ❌ Could not determine product URL for product ID $PRODUCT_ID"
            exit 1
          fi
          HTTP_CODE=$(curl -s -o /tmp/product-page.html -w "%{http_code}" "$PRODUCT_URL" 2>/dev/null || echo "000")
          if [ "$HTTP_CODE" = "200" ]; then
            # Verify it's not a WordPress error page
            if grep -qi "error-establishing-a-database-connection\|wp-die-message\|Fatal error" /tmp/product-page.html; then
              echo "  ❌ Product page returned HTTP 200 but contains WP error content"
              exit 1
            fi
            echo "  ✅ Product page → ${HTTP_CODE} ($PRODUCT_URL)"
          else
            echo "  ❌ Product page → ${HTTP_CODE} ($PRODUCT_URL)"
            exit 1
          fi

      - name: Save container logs
        if: always()
        run: |
          mkdir -p /tmp/container-logs
          docker compose logs wordpress > /tmp/container-logs/wordpress.log 2>&1 || true
          docker compose logs db > /tmp/container-logs/db.log 2>&1 || true
          docker compose logs wpcli > /tmp/container-logs/wpcli.log 2>&1 || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-logs
          path: |
            /tmp/init-run1.log
            /tmp/init-run2.log
            /tmp/smoke-check.log
            /tmp/block-runtime.log
            /tmp/container-logs/

      - name: Cleanup
        if: always()
        run: docker compose down -v
