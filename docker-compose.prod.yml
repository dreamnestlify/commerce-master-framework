# ──────────────────────────────────────────────
# Docker Compose — Commerce Master PRODUCTION
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# This overlay:
#   - Adds Caddy reverse proxy with automatic HTTPS (Let's Encrypt)
#   - Removes public access to MariaDB (3307) and phpMyAdmin (8090)
#   - Sets WordPress to internal-only port (Caddy proxies :80/:443 -> wordpress:80)
#   - Disables WP_DEBUG for production
#   - Runs composer install on WordPress startup to install plugin dependencies
# ──────────────────────────────────────────────
services:

  # ── Caddy Reverse Proxy (automatic HTTPS) ──
  caddy:
    image: caddy:2-alpine
    container_name: commerce_master_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    env_file:
      - .env
    depends_on:
      - wordpress
    networks:
      - commerce_net

  # ── WordPress (override: remove public port, disable debug, auto composer install) ──
  wordpress:
    ports: []  # No public port — Caddy proxies to it
    entrypoint: ["/bin/bash", "/entrypoint-prod.sh"]
    volumes:
      - wordpress_data:/var/www/html
      # Plugin directory must be writable so composer can install vendor/ on startup.
      - ./wp-content/plugins/commerce-core:/var/www/html/wp-content/plugins/commerce-core
      - ./wp-content/themes/commerce-block-theme:/var/www/html/wp-content/themes/commerce-block-theme:ro
      - ./scripts/entrypoint-prod.sh:/entrypoint-prod.sh:ro
    environment:
      WORDPRESS_DEBUG: "false"
      WORDPRESS_DEBUG_LOG: "false"
      WORDPRESS_DEBUG_DISPLAY: "false"
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_HOME', '${WP_HOME}');
        define('WP_SITEURL', '${WP_SITEURL}');
        define('WP_DEBUG', false);
        define('WP_DEBUG_LOG', false);
        define('WP_DEBUG_DISPLAY', false);
        define('FORCE_SSL_ADMIN', true);
        define('AUTH_KEY', '${AUTH_KEY}');
        define('SECURE_AUTH_KEY', '${SECURE_AUTH_KEY}');
        define('LOGGED_IN_KEY', '${LOGGED_IN_KEY}');
        define('NONCE_KEY', '${NONCE_KEY}');
        define('AUTH_SALT', '${AUTH_SALT}');
        define('SECURE_AUTH_SALT', '${SECURE_AUTH_SALT}');
        define('LOGGED_IN_SALT', '${LOGGED_IN_SALT}');
        define('NONCE_SALT', '${NONCE_SALT}');

  # ── MariaDB (override: remove public port) ──
  db:
    ports: []  # No public port — internal only

  # ── phpMyAdmin (override: bind to localhost only, disabled by default) ──
  phpmyadmin:
    ports:
      - "127.0.0.1:8090:80"  # Only accessible via SSH tunnel
    profiles:
      - pma  # Only starts with: docker compose --profile pma ...

volumes:
  caddy_data:
  caddy_config:
